name: CI

on:
  push:
    branches: [master, 'improve/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.0', '1.27.1']
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          gofmt -w *.go
          git diff --exit-code -- '*.go'
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test -mod=readonly ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Build
        run: |
          mkdir -p dist
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          go build -mod=readonly -trimpath -ldflags="-s -w -X main.version=dev -X main.commit=$GITHUB_SHA" -o "dist/getJS$suffix" .
          "dist/getJS$suffix" --version
          "dist/getJS$suffix" --help
      - name: Upload binary
        if: matrix.go == '1.27.1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: getJS-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache-dependency-path: go.sum
      - run: go test -mod=readonly -race ./...
